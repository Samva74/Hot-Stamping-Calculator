const $=id=>document.getElementById(id);function t(k){return (TXT[lang]&&TXT[lang][k])||TXT.fr[k]||k}function num(id){return parseFloat(($(id).value||'').toString().replace(',','.'))}function fmt(x,d=1){if(!isFinite(x))return '–';return Number(x).toLocaleString(lang==='en'?'en-US':'fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})}function key(){return $('support').value+' | '+$('foil').value+' | '+$('machine').value+' | '+$('operation').value}function getCalibs(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}}}function setCalibs(o){localStorage.setItem(STORE,JSON.stringify(o))}function getLib(){try{return JSON.parse(localStorage.getItem(STORE_LIB))||{supports:[],foils:[]}}catch(e){return {supports:[],foils:[]}}}function setLib(o){localStorage.setItem(STORE_LIB,JSON.stringify(o))}function allSupports(){let l=getLib();return SUPPORTS.concat(l.supports||[])}function allFoils(){let l=getLib();return FOILS.concat(l.foils||[])}function setLang(l){lang=l;localStorage.setItem('hot_stamp_lang',lang);refreshText()}
function refreshText(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));['fr','en','pt'].forEach(l=>{$('lnk-'+l).className=(l===lang?'active':'')});fillOps();calc()}
function fillSelects(){let s=$('support'),f=$('foil');let sv=s.value,fv=f.value;s.innerHTML='';allSupports().forEach((x,i)=>s.add(new Option(x.name,i)));if(sv)s.value=sv;f.innerHTML='';allFoils().forEach((x,i)=>f.add(new Option(x.brand+' - '+x.ref,i)));if(fv)f.value=fv;fillOps()}

function calc(){let S=allSupports()[parseInt($('support').value||0)],F=allFoils()[parseInt($('foil').value||0)],O=OPS[$('operation').value]||OPS.standard;if(!S||!F)return;let c=getCalibs()[key()],valid=!!c;let tmin=S.t[0]+F.dt,trec=S.t[1]+F.dt,tmax=S.t[2]+F.dt;let pmin=S.p[0]*F.fp,prec=S.p[1]*F.fp,pmax=S.p[2]*F.fp;let dmin=S.d[0]*F.fd,drec=S.d[1]*F.fd,dmax=S.d[2]*F.fd;trec*=O.t;prec*=O.p;drec*=O.d;if(c){trec=c.temp;prec=c.press;drec=c.dwell}let mt=num('maxTemp')*num('mTemp'),mp=num('maxPress')*num('mPress'),md=num('maxDwell')*num('mDwell');let rt=Math.min(trec,mt),rp=Math.min(prec,mp),rd=Math.min(drec,md);$('boxTemp').className='res-big'+(valid?' valid':'');$('boxPress').className='res-big'+(valid?' valid':'');$('boxDwell').className='res-big'+(valid?' valid':'');$('modeBadge').innerHTML=valid?'<span class="badge valid">'+t('valid')+'</span>':'<span class="badge theo">'+t('theo')+'</span>';$('validBanner').className=valid?'valid-banner':'valid-banner hidden';if(valid)$('validBanner').textContent=t('valid')+' '+(c.date||'')+(c.note?' — '+c.note:'');$('rTemp').textContent=fmt(rt,0);$('rPress').textContent=fmt(rp,1);$('rDwell').textContent=fmt(rd,1);$('rTRange').textContent=fmt(tmin,0)+' à '+fmt(tmax,0)+' °C';$('rPRange').textContent=fmt(pmin,1)+' à '+fmt(pmax,1)+' bar';$('rDRange').textContent=fmt(dmin,1)+' à '+fmt(dmax,1)+' s';let limited=(trec>mt||prec>mp||drec>md);$('rCompat').innerHTML=limited?'<span class="badge warn">'+t('limited')+'</span>':'<span class="badge ok">'+t('ok')+'</span>';$('rRisk').textContent='⚠️ '+S.risk;$('dSupport').textContent=S.name+' · '+S.family;$('dFoil').textContent=F.brand+' - '+F.ref;$('dType').textContent=F.type;$('dEffect').textContent=F.effect;$('cTemp').value=Math.round(rt);$('cPress').value=Math.round(rp*10)/10;$('cDwell').value=Math.round(rd*10)/10;renderList()}
function saveCalib(){let temp=num('cTemp'),press=num('cPress'),dwell=num('cDwell');if(!(temp>0&&press>0&&dwell>0)){toast('OK ?');return}let o=getCalibs();o[key()]={temp,press,dwell,note:$('cNote').value.trim(),date:new Date().toLocaleDateString('fr-FR')};setCalibs(o);$('cNote').value='';toast('OK');calc()}function clearActive(){let o=getCalibs();delete o[key()];setCalibs(o);calc();toast('OK')}function fillFromResult(){calc();toast('OK')}

function exportCalib(){let b=new Blob([JSON.stringify(getCalibs(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hot_stamping_calibrations_v1.json';a.click()}function importCalib(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let imp=JSON.parse(rd.result),cur=getCalibs();Object.keys(imp).forEach(k=>cur[k]=imp[k]);setCalibs(cur);calc();toast('OK')}catch(e){toast('JSON ?')}};rd.readAsText(f);ev.target.value=''}

on saveModal(){let lib=getLib();if(currentModal==='support'){let name=$('mName').value.trim();if(!name)return toast('Nom ?');lib.supports.push({name,family:$('mFamily').value||'Custom',t:[num('mTmin'),num('mTrec'),num('mTmax')],p:[Math.max(0.5,num('mPrec')*0.5),num('mPrec'),num('mPrec')*1.7],d:[Math.max(0.1,num('mDrec')*0.5),num('mDrec'),num('mDrec')*1.7],risk:$('mRisk').value||'À tester.'})}if(currentModal==='foil'){let brand=$('fBrand').value.trim(),ref=$('fRef').value.trim();if(!brand||!ref)return toast('Nom ?');lib.foils.push({brand,ref,type:$('fType').value||'Custom',effect:$('fEffect').value||'',dt:num('fDt')||0,fp:num('fFp')||1,fd:num('fFd')||1})}setLib(lib);closeModal();fillSelects();toast('OK')}
let toastTimer;function toast(msg){let e=$('toast');e.textContent=msg;e.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.className='toast',1800)}document.addEventListener('input',e=>{if(!['cTemp','cPress','cDwell','cNote'].includes(e.target.id))calc()});document.addEventListener('change',e=>{if(e.target.id==='machine'){let m=JSON.parse(localStorage.getItem(STORE_MACH)||'{}')[$('machine').value];if(m){$('maxTemp').value=m.t;$('maxPress').value=m.p;$('maxDwell').value=m.d}}calc()});
