f}.btn-ghost{background:var(--card2);color:var(--muted);font-size:14px;font-weight:600;padding:13px}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calib-item{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px}.calib-item .t{font-weight:700;color:#86efac;font-size:13px}.calib-item .s{color:var(--muted);margin-top:4px}.calib-item .del{color:var(--err);float:right;font-size:12px;font-weight:700;cursor:pointer;background:rgba(239,68,68,.12);padding:4px 10px;border-radius:8px}.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;z-index:50}.toast.show{opacity:1}.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px}.label-row label{margin:0}.mini-plus{width:34px;height:34px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:24px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}.selector-card{padding:10px;margin-bottom:16px}.version-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.version-row a{display:block;text-align:center;text-decoration:none;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;font-size:14px;font-weight:800}.version-row a.active{background:var(--accent);color:#fff;border-color:var(--accent)}.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow:auto}.modal-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 38px rgba(0,0,0,.55)}.modal- /* FPM luxury visual theme */
html,body{background:var(--bg)!important;color:var(--txt)!important;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 28px;}
header.brand-header{display:block!important;text-align:center;padding:30px 16px 26px;margin:4px 0 18px;border-bottom:1px solid rgba(0,0,0,.18);background:transparent;color:#000;}
.brand-mark{font-family:Georgia,"Times New Roman",serif;font-size:74px;line-height:.78;letter-spacing:-8px;font-weight:400;color:#000;margin-bottom:22px;}
.brand-title{font-size:20px;letter-spacing:8px;font-weight:400;color:#000;text-transform:uppercase;}
.brand-title b{font-weight:800;letter-spacing:2px;margin-left:8px;}
.brand-subtitle{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:4px;color:#000;text-transform:uppercase;margin-top:8px;}
.brand-app{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-top:18px;}
.card{background:rgba(245,245,243,.94)!important;border:1px solid var(--line)!important;box-shadow:0 10px 30px rgba(0,0,0,.08)!important;color:var(--txt)!important;}
.card h2{color:#0B0B0B!important;letter-spacing:1.1px;}
.card h2 .dot{background:#0B0B0B!important;}
label{color:#5F5F5F!important;letter-spacing:.2px;}
select,input{background:#FFFFFF!important;color:#0B0B0B!important;border:1.5px solid #B8B2A8!important;box-shadow:none!important;}
input:focus,select:focus{border-color:#0B0B0B!important;box-shadow:0 0 0 3px rgba(0,0,0,.10)!important;}
.version-row a{background:#ECEAE6!important;color:#111!important;border-color:#C8C4BF!important;}
.version-row a.active{background:#0B0B0B!important;color:#fff!important;border-color:#0B0B0B!important;}
.selector-card{background:transparent!important;border:none!important;box-shadow:none!important;padding:0!important;}
.mini-plus{background:#0B0B0B!important;color:#fff!important;box-shadow:0 6px 16px rgba(0,0,0,.18)!important;}
#results .card h2{color:#0B0B0B!important;}
#results .card h2 .dot{background:#0B0B0B!important;}
.res-big{background:#FFFFFF!important;border:2px solid #0B0B0B!important;border-radius:16px!important;}
.res-big.valid{background:#E9F2E6!important;border-color:#0B0B0B!important;}
.res-big .lbl{color:#5F5F5F!important;}
.res-big .val{color:#0B0B0B!important;font-weight:900!important;}
.res-big.valid .val{color:#0B0B0B!important;}
.res-big .u{color:#555!important;}
.res-line{border-bottom:1px solid #D2CEC7!important;}
.res-line .k{color:#666!important;}
.res-line .v{color:#111!important;}
.badge.ok{background:rgba(0,0,0,.08)!important;color:#0B0B0B!important;}
.badge.warn{background:#EFE5D6!important;color:#7A4A00!important;}
.badge.valid{background:#DCE8D7!important;color:#0B0B0B!important;}
.badge.theo{background:#E8E5DF!important;color:#333!important;}
.vigil{background:#EFE8DD!important;border-left:3px solid #0B0B0B!important;color:#111!important;}
.valid-banner{background:#E9F2E6!important;border-left:3px solid #0B0B0B!important;color:#111!important;}
.details summary{color:#0B0B0B!important;}
.details .grid{color:#666!important;}
.details .grid b{color:#111!important;}
#calib .card h2{color:#0B0B0B!important;}
#calib .card h2 .dot{background:#0B0B0B!important;}
.calib-inputs input{background:#E9F2E6!important;border-color:#6D8B74!important;color:#0B0B0B!important;}
.btn-save{background:#0B0B0B!important;color:#fff!important;}
.btn-ghost{background:#ECEAE6!important;color:#0B0B0B!important;border:1px solid #C8C4BF!important;}
.calib-item{background:#ECEAE6!important;border-color:#C8C4BF!important;}
.calib-item .t{color:#0B0B0B!important;}
.calib-item .s{color:#555!important;}
.empty{color:#666!important;}
.toast{background:#0B0B0B!important;color:#fff!important;}
.modal{background:rgba(0,0,0,.42)!important;}
.modal-card{background:#F5F5F3!important;border-color:#C8C4BF!important;color:#0B0B0B!important;}
.modal-head h2{color:#0B0B0B!important;}
.modal-close{background:#ECEAE6!important;color:#0B0B0B!important;}
.modal-section{background:#FFFFFF!important;border-color:#C8C4BF!important;}
.foot{color:#666!important;}
@media(max-width:720px){.brand-mark{font-size:56px}.brand-title{font-size:16px;letter-spacing:5px}.brand-subtitle{font-size:19px}.brand-app{font-size:11px;letter-spacing:2px}.wrap{padding:12px 10px 24px}}


/* Official FPM logo inserted from the provided PNG */
header.brand-header.exact-logo-header{padding:28px 16px 24px!important;background:transparent!important;border-bottom:1px solid rgba(0,0,0,.18)!important;}
.fpm-logo-img{display:block;width:min(360px,72vw);height:auto;margin:0 auto 18px;object-fit:contain;}
.exact-logo-header .brand-app{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-top:10px;}
@media(max-width:720px){.fpm-logo-img{width:min(280px,78vw);}.exact-logo-header .brand-app{font-size:10px;letter-spacing:2px;}}


/* Transparent official FPM logo: no white background around PNG */
.fpm-logo-img{background:transparent!important;mix-blend-mode:normal!important;}
header.brand-header.exact-logo-header{background:transparent!important;}

</style>

const $=id=>document.getElementById(id);function t(k){return (TXT[lang]&&TXT[lang][k])||TXT.fr[k]||k}function num(id){return parseFloat(($(id).value||'').toString().replace(',','.'))}function fmt(x,d=1){if(!isFinite(x))return '–';return Number(x).toLocaleString(lang==='en'?'en-US':'fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})}function key(){return $('support').value+' | '+$('foil').value+' | '+$('machine').value+' | '+$('operation').value}function getCalibs(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}}}function setCalibs(o){localStorage.setItem(STORE,JSON.stringify(o))}function getLib(){try{return JSON.parse(localStorage.getItem(STORE_LIB))||{supports:[],foils:[]}}catch(e){return {supports:[],foils:[]}}}function setLib(o){localStorage.setItem(STORE_LIB,JSON.stringify(o))}function allSupports(){let l=getLib();return SUPPORTS.concat(l.supports||[])}function allFoils(){let l=getLib();return FOILS.concat(l.foils||[])}function setLang(l){lang=l;localStorage.setItem('hot_stamp_lang',lang);refreshText()}
function refreshText(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));['fr','en','pt'].forEach(l=>{$('lnk-'+l).className=(l===lang?'active':'')});fillOps();calc()}
function fillSelects(){let s=$('support'),f=$('foil');let sv=s.value,fv=f.value;s.innerHTML='';allSupports().forEach((x,i)=>s.add(new Option(x.name,i)));if(sv)s.value=sv;f.innerHTML='';allFoils().forEach((x,i)=>f.add(new Option(x.brand+' - '+x.ref,i)));if(fv)f.value=fv;fillOps()}
function fillOps(){let cur=$('operation').value||'standard';$('operation').innerHTML='';Object.keys(OPS).forEach(k=>$('operation').add(new Option(OP_LABELS[k][lang]||OP_LABELS[k].fr,k)));$('operation').value=OPS[cur]?cur:'standard'}
function calc(){let S=allSupports()[parseInt($('support').value||0)],F=allFoils()[parseInt($('foil').value||0)],O=OPS[$('operation').value]||OPS.standard;if(!S||!F)return;let c=getCalibs()[key()],valid=!!c;let tmin=S.t[0]+F.dt,trec=S.t[1]+F.dt,tmax=S.t[2]+F.dt;let pmin=S.p[0]*F.fp,prec=S.p[1]*F.fp,pmax=S.p[2]*F.fp;let dmin=S.d[0]*F.fd,drec=S.d[1]*F.fd,dmax=S.d[2]*F.fd;trec*=O.t;prec*=O.p;drec*=O.d;if(c){trec=c.temp;prec=c.press;drec=c.dwell}let mt=num('maxTemp')*num('mTemp'),mp=num('maxPress')*num('mPress'),md=num('maxDwell')*num('mDwell');let rt=Math.min(trec,mt),rp=Math.min(prec,mp),rd=Math.min(drec,md);$('boxTemp').className='res-big'+(valid?' valid':'');$('boxPress').className='res-big'+(valid?' valid':'');$('boxDwell').className='res-big'+(valid?' valid':'');$('modeBadge').innerHTML=valid?'<span class="badge valid">'+t('valid')+'</span>':'<span class="badge theo">'+t('theo')+'</span>';$('validBanner').className=valid?'valid-banner':'valid-banner hidden';if(valid)$('validBanner').textContent=t('valid')+' '+(c.date||'')+(c.note?' — '+c.note:'');$('rTemp').textContent=fmt(rt,0);$('rPress').textContent=fmt(rp,1);$('rDwell').textContent=fmt(rd,1);$('rTRange').textContent=fmt(tmin,0)+' à '+fmt(tmax,0)+' °C';$('rPRange').textContent=fmt(pmin,1)+' à '+fmt(pmax,1)+' bar';$('rDRange').textContent=fmt(dmin,1)+' à '+fmt(dmax,1)+' s';let limited=(trec>mt||prec>mp||drec>md);$('rCompat').innerHTML=limited?'<span class="badge warn">'+t('limited')+'</span>':'<span class="badge ok">'+t('ok')+'</span>';$('rRisk').textContent='⚠️ '+S.risk;$('dSupport').textContent=S.name+' · '+S.family;$('dFoil').textContent=F.brand+' - '+F.ref;$('dType').textContent=F.type;$('dEffect').textContent=F.effect;$('cTemp').value=Math.round(rt);$('cPress').value=Math.round(rp*10)/10;$('cDwell').value=Math.round(rd*10)/10;renderList()}
function saveCalib(){let temp=num('cTemp'),press=num('cPress'),dwell=num('cDwell');if(!(temp>0&&press>0&&dwell>0)){toast('OK ?');return}let o=getCalibs();o[key()]={temp,press,dwell,note:$('cNote').value.trim(),date:new Date().toLocaleDateString('fr-FR')};setCalibs(o);$('cNote').value='';toast('OK');calc()}function clearActive(){let o=getCalibs();delete o[key()];setCalibs(o);calc();toast('OK')}function fillFromResult(){calc();toast('OK')}
function renderList(){let o=getCalibs(),ks=Object.keys(o),el=$('calibList');if(!ks.length){el.innerHTML='<div class="empty">'+t('empty')+'</div>';return}el.innerHTML=ks.map((k,i)=>'<div class="calib-item"><span class="del" onclick="delCalib('+i+')">'+t('delete')+'</span><div class="t">'+k+'</div><div class="s">'+fmt(o[k].temp,0)+' °C · '+fmt(o[k].press,1)+' bar · '+fmt(o[k].dwell,1)+' s<br><i>'+o[k].date+'</i></div></div>').join('')}function delCalib(i){let o=getCalibs(),ks=Object.keys(o);delete o[ks[i]];setCalibs(o);calc()}
function exportCalib(){let b=new Blob([JSON.stringify(getCalibs(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hot_stamping_calibrations_v1.json';a.click()}function importCalib(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let imp=JSON.parse(rd.result),cur=getCalibs();Object.keys(imp).forEach(k=>cur[k]=imp[k]);setCalibs(cur);calc();toast('OK')}catch(e){toast('JSON ?')}};rd.readAsText(f);ev.target.value=''}
function openModal(type){currentModal=type;let title={support:t('addSupport'),foil:t('addFoil'),machine:t('addMachine')}[type];$('modalTitle').textContent=title;let h='';if(type==='support')h='<div class="modal-section"><label>'+t('name')+'</label><input id="mName"><label>'+t('family')+'</label><input id="mFamily" value="Custom"><div class="row"><div><label>Temp min</label><input id="mTmin" type="number" value="90"></div><div><label>Temp rec</label><input id="mTrec" type="number" value="115"></div></div><label>Temp max</label><input id="mTmax" type="number" value="140"><div class="row"><div><label>Pression rec</label><input id="mPrec" type="number" step="0.1" value="3"></div><div><label>Temps rec</label><input id="mDrec" type="number" step="0.1" value="1.5"></div></div><label>Risque</label><input id="mRisk" value="Réglage ajouté manuellement, à tester."></div>';if(type==='foil')h='<div class="modal-section"><label>Marque</label><input id="fBrand"><label>Référence</label><input id="fRef"><label>Type</label><input id="fType" value="Métallisé"><label>Effet</label><input id="fEffect"><div class="row"><div><label>Δ Temp °C</label><input id="fDt" type="number" value="0"></div><div><label>Coef pression</label><input id="fFp" type="number" step="0.01" value="1"></div></div><label>Coef temps</label><input id="fFd" type="number" step="0.01" value="1"></div>';if(type==='machine')h='<div class="modal-section"><label>'+t('name')+'</label><input id="maName"><div class="row"><div><label>'+t('tmax')+'</label><input id="maT" type="number" value="180"></div><div><label>'+t('pmax')+'</label><input id="maP" type="number" value="6"></div></div><label>'+t('dmax')+'</label><input id="maD" type="number" value="10"></div>';$('modalBody').innerHTML=h+'<button class="btn btn-save" onclick="saveModal()">'+t('add')+'</button><button class="btn btn-ghost" onclick="closeModal()">'+t('cancel')+'</button>';$('modal').className='modal'}function closeModal(){$('modal').className='modal hidden'}function saveModal(){let lib=getLib();if(currentModal==='support'){let name=$('mName').value.trim();if(!name)return toast('Nom ?');lib.supports.push({name,family:$('mFamily').value||'Custom',t:[num('mTmin'),num('mTrec'),num('mTmax')],p:[Math.max(0.5,num('mPrec')*0.5),num('mPrec'),num('mPrec')*1.7],d:[Math.max(0.1,num('mDrec')*0.5),num('mDrec'),num('mDrec')*1.7],risk:$('mRisk').value||'À tester.'})}if(currentModal==='foil'){let brand=$('fBrand').value.trim(),ref=$('fRef').value.trim();if(!brand||!ref)return toast('Nom ?');lib.foils.push({brand,ref,type:$('fType').value||'Custom',effect:$('fEffect').value||'',dt:num('fDt')||0,fp:num('fFp')||1,fd:num('fFd')||1})}setLib(lib);closeModal();fillSelects();toast('OK')}
let toastTimer;function toast(msg){let e=$('toast');e.textContent=msg;e.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.className='toast',1800)}document.addEventListener('input',e=>{if(!['cTemp','cPress','cDwell','cNote'].includes(e.target.id))calc()});document.addEventListener('change',e=>{if(e.target.id==='machine'){let m=JSON.parse(localStorage.getItem(STORE_MACH)||'{}')[$('machine').value];if(m){$('maxTemp').value=m.t;$('maxPress').value=m.p;$('maxDwell').value=m.d}}calc()});
function initMachines(){let custom=JSON.parse(localStorage.getItem(STORE_MACH)||'{}');Object.keys(custom).forEach(k=>$('machine').add(new Option(k,k)))}function saveMachineItem(name,t,p,d){let m=JSON.parse(localStorage.getItem(STORE_MACH)||'{}');m[name]={t,p,d};localStorage.setItem(STORE_MACH,JSON.stringify(m))}
const oldSaveModal=saveModal;saveModal=function(){if(currentModal==='machine'){let name=$('maName').value.trim();if(!name)return toast('Nom ?');saveMachineItem(name,num('maT'),num('maP'),num('maD'));$('machine').add(new Option(name,name));$('machine').value=name;closeModal();toast('OK');return}oldSaveModal()}
